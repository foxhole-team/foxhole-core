[package]
name = "foxhole-sentinel-yara"
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
publish = false
license = "GPL-3.0-or-later"

[workspace]
resolver = "3"
exclude = ["vendor/yara-x", "vendor/yara-x-parser"]

[lib]
crate-type = ["cdylib", "rlib"]
test = false
doctest = false

[dependencies]
yara-x = { version = "=1.21.0", default-features = false, features = ["constant-folding", "exact-atoms", "fast-regexp", "generate-proto-code", "pulley", "dex-module", "hash-module", "math-module", "string-module"] }
yara-x-parser = "=1.21.0"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
libc = "=0.2.190"

[build-dependencies]
cc = "=1.6.0"

[profile.dev.package.yara-x-parser]
opt-level = 1

[profile.release]
strip = "debuginfo"
lto = "thin"
codegen-units = 1
panic = "abort"

[patch.crates-io]
yara-x = { path = "vendor/yara-x" }
yara-x-parser = { path = "vendor/yara-x-parser" }
