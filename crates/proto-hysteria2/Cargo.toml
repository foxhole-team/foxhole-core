[package]
name = "proto-hysteria2"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hysteria2 codec and QUIC outbound for FoxCore"

[dependencies]
blake2.workspace = true
bytes.workspace = true
foxcore-api = { path = "../foxcore-api" }
foxcore-dialer = { path = "../foxcore-dialer" }
foxcore-transport = { path = "../foxcore-transport" }
getrandom.workspace = true
qpack.workspace = true
quinn.workspace = true
quinn-proto.workspace = true
rustls.workspace = true
rustls-pki-types.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zerocopy.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The QUIC Initial parser and its capture socket, which is how this crate's
# fingerprint tests read their own first flight back off the wire. Feature-gated
# so no shipped build carries it; a dev-dependency so `cargo ndk check` (which
# builds no tests) never turns it on.
foxcore-transport = { path = "../foxcore-transport", features = ["fingerprinting"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
