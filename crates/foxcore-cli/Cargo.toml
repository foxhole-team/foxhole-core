[package]
name = "foxcore-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Linux router command-line adapter for FoxCore"

[features]
default = ["hysteria2"]
vless = ["foxcore-runtime/vless"]
vmess = ["foxcore-runtime/vmess"]
hysteria2 = ["foxcore-runtime/hysteria2"]
tuic = ["foxcore-runtime/tuic"]
trojan = ["foxcore-runtime/trojan"]
shadowsocks = ["foxcore-runtime/shadowsocks"]
wireguard = ["foxcore-runtime/wireguard", "foxcore-tun/wireguard"]
naive = ["foxcore-runtime/naive"]
anytls = ["foxcore-runtime/anytls"]
shadowtls = ["foxcore-runtime/shadowtls"]
socks = ["foxcore-runtime/socks"]
http = ["foxcore-runtime/http"]
all-vpn = ["vless", "vmess", "hysteria2", "tuic", "trojan", "shadowsocks", "wireguard", "naive", "anytls", "shadowtls", "socks", "http"]

[dependencies]
foxcore-api = { path = "../foxcore-api" }
foxcore-dialer = { path = "../foxcore-dialer" }
foxcore-dns = { path = "../foxcore-dns" }
foxcore-link = { path = "../foxcore-link" }
foxcore-transport = { path = "../foxcore-transport" }
getrandom.workspace = true
foxcore-runtime = { path = "../foxcore-runtime", default-features = false }
foxcore-tun = { path = "../foxcore-tun", default-features = false }
libc.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "signal"] }
zeroize.workspace = true

[dev-dependencies]
tempfile = "3.27.0"
