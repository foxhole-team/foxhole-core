[package]
name = "foxcore-tun"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "TUN device and in-process flow engine for FoxCore"

[features]
default = ["wireguard"]
fuzzing = []
wireguard = ["foxcore-outbound/wireguard", "dep:proto-wireguard"]

[dependencies]
arc-swap.workspace = true
bytes.workspace = true
# The Fox-owned UDP/ICMP packet boundary uses etherparse; smoltcp owns TCP.
etherparse = { version = "0.19.0", default-features = false, features = ["std"] }
foxcore-api = { path = "../foxcore-api" }
foxcore-dialer = { path = "../foxcore-dialer" }
foxcore-dns = { path = "../foxcore-dns" }
foxcore-outbound = { path = "../foxcore-outbound", default-features = false }
foxcore-relay = { path = "../foxcore-relay" }
foxcore-route = { path = "../foxcore-route" }
foxcore-trafficmap = { path = "../foxcore-trafficmap" }
foxcore-transport = { path = "../foxcore-transport" }
getrandom.workspace = true
h2.workspace = true
http.workspace = true
libc.workspace = true
log = "0.4.33"
parking_lot = "0.12.5"
proto-wireguard = { path = "../proto-wireguard", optional = true }
serde.workspace = true
thiserror.workspace = true
sha2.workspace = true
smoltcp.workspace = true
tokio.workspace = true
tokio-util.workspace = true
url.workspace = true
zerocopy.workspace = true

[dev-dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
criterion.workspace = true
fst.workspace = true
foxcore-dialer = { path = "../foxcore-dialer" }
foxcore-outbound = { path = "../foxcore-outbound", features = ["i2p", "wireguard"] }
proptest = "1.11.0"
proto-wireguard = { path = "../proto-wireguard", features = ["test-support"] }
rand.workspace = true
# `start_paused`: the relay's liveness deadline is four `REKEY_TIMEOUT` windows,
# and a test that waited them out in wall-clock time would cost twenty seconds
# to assert one event.
tokio = { workspace = true, features = ["test-util"] }
serde_json.workspace = true

[[bench]]
name = "packet_path"
harness = false
required-features = ["wireguard"]
