[package]
name = "proto-vless"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "VLESS codec and outbound for FoxCore"

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
aws-lc-rs.workspace = true
base64.workspace = true
bytes.workspace = true
chacha20poly1305.workspace = true
ctr.workspace = true
foxcore-api = { path = "../foxcore-api" }
foxcore-dialer = { path = "../foxcore-dialer" }
foxcore-transport = { path = "../foxcore-transport" }
getrandom.workspace = true
proto-reality = { path = "../proto-reality" }
sha2.workspace = true
tokio.workspace = true
tokio-util.workspace = true
zeroize.workspace = true

[dev-dependencies]
# The reference BLAKE3, used only as the oracle for `src/encryption/blake3.rs`.
blake3.workspace = true
foxcore-link = { path = "../foxcore-link" }
# The REALITY server harness. Dev-only: `testkit` is off by default and the
# dependency above does not enable it, so a shipped build never contains it.
proto-reality = { path = "../proto-reality", features = ["testkit"] }
serde_json.workspace = true
