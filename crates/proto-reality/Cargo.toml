[package]
name = "proto-reality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Fail-closed REALITY TLS 1.3 client transport for FoxCore"

[features]
default = []
# Opens the private TLS 1.3 record layer to the out-of-tree fuzz harness in
# `fuzz/`. Off by default and enabled by nothing inside this workspace.
fuzzing = []
# A minimal REALITY *server*, so an integration test can complete a handshake
# and assert on what a carrier above it sends. Off by default; enabled only by
# dev-dependencies, never by a shipped build.
testkit = ["dep:rcgen"]

[dependencies]
aws-lc-rs.workspace = true
# Only ever present with `testkit`; the shipped library does not generate
# certificates.
rcgen = { version = "0.14.5", default-features = false, features = [
    "aws_lc_rs",
], optional = true }
base64.workspace = true
foxcore-transport = { path = "../foxcore-transport" }
rand.workspace = true
# The signed hello-table feed arrives as JSON. Only `runtime_tables.rs` reads
# it, and only into the slot vocabulary the generator already implements — the
# generator itself is compiled in and never crosses the network.
serde_json.workspace = true
subtle.workspace = true
tokio.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = { version = "0.14.5", default-features = false, features = ["aws_lc_rs"] }
# The JA3/JA4 computation validated against a live detector in
# `foxcore-transport/tests/ja_fingerprint.rs`. One implementation, two callers.
foxcore-transport = { path = "../foxcore-transport", features = ["fingerprinting"] }
