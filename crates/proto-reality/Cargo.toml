[package]
name = "proto-reality"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Fail-closed REALITY TLS 1.3 client transport for FoxCore"

[features]
default = []
# Opens the private TLS 1.3 record layer to the out-of-tree fuzz harness in
# `fuzz/`. Off by default and enabled by nothing inside this workspace.
fuzzing = []

[dependencies]
aws-lc-rs.workspace = true
base64.workspace = true
foxcore-transport = { path = "../foxcore-transport" }
rand.workspace = true
subtle.workspace = true
tokio.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[dev-dependencies]
rcgen = { version = "0.14.5", default-features = false, features = ["aws_lc_rs"] }
