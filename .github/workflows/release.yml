name: release
on:
  workflow_dispatch:
    inputs:
      lab_handoff_commit:
        description: Existing owner-signed immutable LAB handoff commit
        required: true
        type: string
      lab_handoff_sha256:
        description: Exact metadata/lab-release-handoff.json SHA-256
        required: true
        type: string
concurrency:
  group: foxcore-release
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  release:
    if: github.server_url == 'https://github.com' && github.repository == 'foxhole-team/foxhole-core' && github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      attestations: write
      id-token: write
    env:
      HANDOFF_COMMIT: ${{ inputs.lab_handoff_commit }}
      HANDOFF_SHA256: ${{ inputs.lab_handoff_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify both owner signatures and select exact staged bytes
        run: |
          set -euo pipefail
          [[ "$(gh api "repos/$GITHUB_REPOSITORY" --jq .visibility)" == public ]]
          python3 scripts/verify-lab-release.py describe --source "$GITHUB_SHA" --handoff-commit "$HANDOFF_COMMIT" --handoff-sha256 "$HANDOFF_SHA256" > "$RUNNER_TEMP/lab-selection.json"
          tag="$(jq -r .release_tag "$RUNNER_TEMP/lab-selection.json")"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo 'Final release/tag already exists' >&2; exit 1
          fi
      - name: Download only the handoff-selected repository asset
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/lab-selection.json"
          tag="$(jq -r .staging_tag "$selection")"
          asset="$(jq -r .staging_asset "$selection")"
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets > "$RUNNER_TEMP/lab-assets.json"
          jq -e --arg asset "$asset" --argjson size "$(jq .archive_bytes "$selection")" '[.assets[] | select(.name == $asset and .size == $size)] | length == 1' "$RUNNER_TEMP/lab-assets.json"
          mkdir -m 700 "$RUNNER_TEMP/lab-download"
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern "$asset" --dir "$RUNNER_TEMP/lab-download"
          python3 scripts/verify-lab-release.py verify --source "$GITHUB_SHA" --handoff-commit "$HANDOFF_COMMIT" --handoff-sha256 "$HANDOFF_SHA256" --archive "$RUNNER_TEMP/lab-download/$asset" --output "$RUNNER_TEMP/lab-verified"
          mkdir -m 700 release
          release_asset="$(jq -r .release_asset "$selection")"
          cp "$RUNNER_TEMP/lab-download/$asset" "release/$release_asset"
          (cd release && sha256sum "$release_asset" > SHA256SUMS)
      - name: Attest the exact verified LAB release bytes
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6
        with:
          subject-path: release/*
      - name: Publish verified bytes without rebuilding
        run: |
          set -euo pipefail
          selection="$RUNNER_TEMP/lab-selection.json"
          tag="$(jq -r .release_tag "$selection")"
          asset="$(jq -r .release_asset "$selection")"
          printf 'Exact owner-approved LAB artifact. Source %s; compiled producer %s; handoff %s.\n' "$GITHUB_SHA" "$(jq -r .producer_commit "$selection")" "$HANDOFF_COMMIT" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$tag" "release/$asset" release/SHA256SUMS --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "FoxHole Core $tag" --notes-file "$RUNNER_TEMP/release-notes.txt" --latest
          [[ "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq .object.sha)" == "$GITHUB_SHA" ]]
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '[.assets[].name] | sort' | jq -e --arg asset "$asset" '(["SHA256SUMS", $asset] | sort) as $expected | . == $expected'
