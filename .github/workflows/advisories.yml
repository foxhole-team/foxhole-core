name: fresh-advisories

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev
          persist-credentials: false
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo deny fetch
      - run: cargo deny --locked check advisories
      - run: cargo deny --locked --all-features --config deny-all-features.toml check advisories
