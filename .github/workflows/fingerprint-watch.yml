# Watches uTLS for movement under `fingerprints/*.json`.
#
# The ClientHello this core sends is a parrot, and `scripts/fingerprint-from-utls.py`
# is the check that the committed tables still agree with the population the parrot
# hides in. That script is deliberately never run from the build: a network fetch must
# not be able to change what the binary sends. This workflow does not change that. It
# fetches uTLS on a schedule and *reports*, so that Chrome moving is noticed in days
# rather than at the next release.
#
# It therefore never fails. A divergence from uTLS is news about the outside world, not
# a defect in this tree, and a red X on an untouched commit teaches people to ignore the
# gate. The notification is an issue instead, which someone reads and decides about.
name: fingerprint-watch

# Weekly, and on demand. Not on push: the committed tables are the source of truth for
# the build, `cargo test -p proto-reality` already checks them against `hello_profile.rs`,
# and re-asking upstream on every commit only adds a rate-limited fetch to the gate.
on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

concurrency:
  group: fingerprint-watch
  cancel-in-progress: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # The title is the issue's identity for a human; the marker below is its identity for
  # this workflow. Changing either one orphans the currently open issue.
  ISSUE_TITLE: "fingerprints/ has diverged from uTLS"
  ISSUE_MARKER: "<!-- fingerprint-watch -->"

jobs:
  watch:
    # Scheduled workflows keep running in forks, where they would either fail on a
    # missing token or file issues nobody asked for.
    if: github.repository_owner == 'foxhole-team'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The only write this workflow performs: opening, updating and closing its own
      # divergence issue.
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      # The script uses only the standard library, on purpose — nothing is installed
      # here, so no dependency of this check can be substituted from a package index.
      - name: Compare fingerprints/ against uTLS
        id: compare
        run: |
          set -uo pipefail
          set +e
          python3 scripts/fingerprint-from-utls.py > "$RUNNER_TEMP/report.txt" 2>&1
          code=$?
          set -e

          case "$code" in
            0) status=agree ;;
            1) status=diverged ;;
            *) status=unavailable ;;
          esac
          printf 'status=%s\n' "$status" | tee -a "$GITHUB_OUTPUT"

          # The diff is the whole point of the run, so it is readable from the run page
          # even when no issue is touched.
          {
            printf '## fingerprint-watch: %s\n\n' "$status"
            printf '```text\n'
            cat "$RUNNER_TEMP/report.txt"
            printf '\n```\n'
          } >> "$GITHUB_STEP_SUMMARY"

          cat "$RUNNER_TEMP/report.txt"
          # Never propagate the script's exit code. See the header.
          exit 0

      - name: Open, update or close the divergence issue
        env:
          GH_TOKEN: ${{ github.token }}
          STATUS: ${{ steps.compare.outputs.status }}
          REPORT: ${{ runner.temp }}/report.txt
        run: |
          set -euo pipefail

          # Upstream being unreachable is not a divergence. Say so in the log and leave
          # whatever issue state exists alone, so a GitHub outage cannot close a real
          # divergence report or open a false one.
          if [[ "$STATUS" == "unavailable" ]]; then
            printf 'Could not fetch or parse uTLS; no issue touched.\n' >&2
            exit 0
          fi

          # The marker, not the title, is what makes this idempotent: the issue is found
          # by a string this workflow wrote, so a human retitling it does not cause a
          # second one to be opened next week.
          existing="$(gh issue list --state open --limit 100 --json number,body \
            --jq "map(select(.body // \"\" | contains(\"$ISSUE_MARKER\"))) | .[0].number // empty")"

          if [[ "$STATUS" == "agree" ]]; then
            if [[ -n "$existing" ]]; then
              gh issue comment "$existing" --body \
                "fingerprints/ agrees with uTLS again as of $GITHUB_SHA. Closing."
              gh issue close "$existing" --reason completed
            fi
            exit 0
          fi

          # A digest of the diff itself. A divergence that persists week after week is
          # the same news every week, so an unchanged digest updates nothing: the issue
          # stays open, silent, until the diff actually changes.
          digest="$(sha256sum "$REPORT" | cut -d' ' -f1)"

          body_file="$RUNNER_TEMP/issue-body.md"
          {
            printf '%s\n' "$ISSUE_MARKER"
            printf '<!-- fingerprint-watch:digest=%s -->\n\n' "$digest"
            cat <<'PROSE'
          The committed tables in `fingerprints/` no longer match the uTLS Chrome parrot tables.

          This is a report, not a build failure. Decide deliberately: either uTLS tracked a
          Chrome change and the committed table should follow, or the divergence is intentional
          and belongs in the table's notes. Re-hash with the fingerprint digest convention
          after any edit; `cargo test -p proto-reality` enforces it.

          Field-level diff, from `scripts/fingerprint-from-utls.py`:

          ```text
          PROSE
            cat "$REPORT"
            cat <<'FENCE'

          ```
          FENCE
            printf -- '\n- checked at: %s\n' "$GITHUB_SHA"
            printf -- '- run: %s/%s/actions/runs/%s\n' \
              "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
          } > "$body_file"

          if [[ -z "$existing" ]]; then
            gh issue create --title "$ISSUE_TITLE" --body-file "$body_file"
            exit 0
          fi

          previous="$(gh issue view "$existing" --json body \
            --jq '.body // "" | capture("fingerprint-watch:digest=(?<d>[0-9a-f]{64})").d // empty' 2>/dev/null || true)"
          if [[ "$previous" == "$digest" ]]; then
            printf 'Issue #%s already reports this exact diff; nothing to do.\n' "$existing"
            exit 0
          fi

          gh issue edit "$existing" --body-file "$body_file"
          gh issue comment "$existing" --body \
            "The divergence changed as of $GITHUB_SHA; the issue body now carries the current diff."
